# Ark Seed Multimodal MCP Server: single-organization self-hosted stack.
#
#   Caddy (TLS, public :443) -> ark-mcp (JWT, :3000, not published) -> BytePlus
#                                  |
#                                  +-> Redis (background jobs, internal network only)
#
# One replica only: runtime.sqlite3 and in-process limiters are not distributed.
# Copy .env.example to .env, fill it in, then `docker compose up -d --build`.
# Full guide: docs/self-hosting.md

name: ark-mcp

services:
  ark-mcp:
    image: ${ARK_MCP_IMAGE:-ark-mcp:latest}
    build:
      context: ../..
    restart: unless-stopped
    stop_grace_period: 660s
    env_file: .env
    environment:
      # Pinned here so .env cannot switch the service into an unsafe posture.
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MCP_AUTH_MODE: jwt
      # Public hostname for clients plus the in-network name for internal scrapers.
      # Loopback hosts are always allowed for the container health check.
      MCP_ALLOWED_HOSTS: ${MCP_PUBLIC_HOST:?Set MCP_PUBLIC_HOST in .env},ark-mcp
      # Safe only because Caddy is the sole ingress and overwrites X-Forwarded-For.
      RATE_LIMIT_TRUST_PROXY_HEADERS: "true"
      ARTIFACT_DIR: /app/.artifacts
      FASTMCP_DOCKET_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      FASTMCP_TASKS_ENCRYPTION_KEY: ${FASTMCP_TASKS_ENCRYPTION_KEY:?Set FASTMCP_TASKS_ENCRYPTION_KEY in .env}
    volumes:
      # Holds runtime.sqlite3 (ownership, budgets, execution claims) and, with the
      # filesystem backend, generated artifacts. Back this volume up.
      - ark-state:/app/.artifacts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edge
      - data

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:?Set MCP_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ark-mcp:
        condition: service_healthy
    networks:
      - edge

networks:
  # Caddy <-> ark-mcp, with outbound internet for BytePlus and the JWKS endpoint.
  edge: {}
  # ark-mcp <-> Redis only; no route to or from the outside.
  data:
    internal: true

volumes:
  ark-state: {}
  redis-data: {}
  caddy-data: {}
  caddy-config: {}

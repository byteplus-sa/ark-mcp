name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.26"

jobs:
  quality:
    name: Quality, security, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify lockfile and install
        run: |
          uv lock --check
          uv sync --locked

      - name: Lint and format check
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy src

      - name: Offline tests with coverage
        run: uv run pytest --disable-socket --allow-unix-socket --cov=ark_mcp --cov-report=term-missing

      - name: Static security scan
        run: uv run bandit -q -r src/ark_mcp

      - name: Dependency vulnerability audit
        run: bash scripts/audit_dependencies.sh

      - name: Secret scan
        run: uv run detect-secrets scan --baseline .secrets.baseline

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test installed wheel
        run: |
          uv venv /tmp/ark-wheel-smoke
          uv pip install --python /tmp/ark-wheel-smoke/bin/python dist/*.whl
          /tmp/ark-wheel-smoke/bin/python -c "import ark_mcp; assert ark_mcp.create_server"

  container:
    name: Container build and health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag ark-mcp:ci .

      - name: Exercise health endpoint
        run: |
          docker run --detach --rm --name ark-mcp-ci \
            --publish 127.0.0.1:3000:3000 \
            --env MCP_JWT_JWKS_URI=https://auth.example.test/.well-known/jwks.json \
            --env MCP_JWT_ISSUER=https://auth.example.test/ \
            --env MCP_JWT_AUDIENCE=ark-mcp \
            ark-mcp:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs ark-mcp-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop ark-mcp-ci || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
